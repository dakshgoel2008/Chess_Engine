[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castled"
version = "0.1.0"
description = "A production-grade chess engine with NNUE evaluation"
authors = [{ name = "Daksh" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
training = ["torch>=2.0", "matplotlib"]
gui = ["pygame>=2.5"]

[project.scripts]
castled = "castled.cli:main"

[tool.setuptools.packages.find]
include = ["castled*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
