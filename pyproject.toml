[build-system]
requires = ["setuptools>=61.0", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "castled"
version = "0.1.0"
description = "A production-grade chess engine with NNUE evaluation"
authors = [{ name = "Daksh" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "numpy>=1.24",
    "cffi>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
training = ["torch>=2.0", "matplotlib"]
gui = ["pygame-ce>=2.5"]

[project.scripts]
castled = "castled.cli:main"

[tool.setuptools.packages.find]
include = ["castled*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E741", "F401"]
