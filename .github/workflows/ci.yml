name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff check
        run: ruff check castled tests tools

  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and build C extension
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m castled.core._build_engine

      - name: Run unit tests (C backend)
        run: pytest -v

      - name: Run unit tests (Pure-Python fallback)
        if: matrix.os == 'ubuntu-latest'
        env:
          CASTLED_PURE_PYTHON: "1"
        run: pytest -v

      - name: Verify Perft and Search Benchmark
        run: |
          python -m castled perft 5
          python -m castled bench 4

